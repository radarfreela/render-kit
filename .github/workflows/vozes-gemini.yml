name: vozes-gemini
on:
  workflow_dispatch:
    inputs:
      projeto: { description: 'prefixo do projeto no R2', required: true }
      textos: { description: 'arquivo de textos dentro do projeto (formato cenas)', default: 'molde/narracao-gemini.json' }
      vozes: { description: 'vozes Gemini separadas por espaço', default: 'Puck Charon Fenrir' }
      modo: { description: 'amostra (tudo num mp3) ou cenas (um wav por cena)', default: 'amostra' }
permissions:
  contents: read
jobs:
  vozes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PROJETO: ${{ inputs.projeto }}
      TEXTOS: ${{ inputs.textos }}
      VOZES: ${{ inputs.vozes }}
      MODO: ${{ inputs.modo }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Conferir entradas
        run: |
          for v in "$PROJETO" "$TEXTOS"; do printf '%s' "$v" | grep -Eq '^[A-Za-z0-9._/-]+$' && ! printf '%s' "$v" | grep -q '\.\.' || { echo "entrada inválida"; exit 1; }; done
          printf '%s' "$VOZES" | grep -Eq '^[A-Za-z ]+$' || { echo "vozes inválidas"; exit 1; }
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Baixar textos do R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          r2() { aws s3 "$@" --endpoint-url "$R2_ENDPOINT" --only-show-errors > /dev/null 2>&1 < /dev/null; }   # sem eco: log de repo público
          r2 cp "s3://$R2_BUCKET/$PROJETO/$TEXTOS" textos.json || { echo "falha no R2"; exit 1; }
      - run: sudo apt-get -qq update > /dev/null && sudo apt-get -qq install -y ffmpeg > /dev/null
      - name: Gerar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          [ -n "$GEMINI_API_KEY" ] || { echo "falta o segredo GEMINI_API_KEY"; exit 1; }
          for v in $VOZES; do
            if [ "$MODO" = cenas ]; then   # uma fala por pedido, com pausa (o plano grátis limita pedidos por minuto)
              for c in $(jq -r '.cenas[].cena' textos.json); do
                for tent in 1 2 3; do
                  python3 vozes_gemini.py --textos textos.json --voz "$v" --saida "saida/voz_$v" --so "$c" > log.txt 2>&1 || true
                  sed -E 's/AIza[A-Za-z0-9_-]+/[chave]/g' log.txt | grep -E "ok|ERRO" | cut -c1-160
                  [ -f "saida/voz_$v/$c.wav" ] && break; sleep 45
                done
                sleep 22
              done
            else
              python3 vozes_gemini.py --textos textos.json --voz "$v" --saida "saida/voz_$v" --amostra 2>&1 | sed -E 's/AIza[A-Za-z0-9_-]+/[chave]/g' | tail -20 | cut -c1-240 || true
            fi
          done
          ls saida
      - name: Subir saída para o R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          r2() { aws s3 "$@" --endpoint-url "$R2_ENDPOINT" --only-show-errors > /dev/null 2>&1 < /dev/null; }
          r2 cp --recursive saida/ "s3://$R2_BUCKET/saida/$GITHUB_RUN_ID/" || { echo "falha no R2"; exit 1; }
          echo "saída: saida/$GITHUB_RUN_ID/"
