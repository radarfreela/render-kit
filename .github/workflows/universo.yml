name: universo
run-name: universo ${{ inputs.id }} ${{ inputs.escritor }}
# Fábrica do Universo Detalhado, sem R2: a API escreve a cena do roteiro aprovado (universo/fabrica/pauta.json), voz Remy,
# 8 máquinas gravam um pedaço cada, uma junta e mixa. O vídeo fica como artefato do próprio run (baixar com gh run download).
on:
  workflow_dispatch:
    inputs:
      id: { description: 'id da pauta', required: true }
      escritor: { description: 'quem escreve a cena: claude ou gemini', default: 'claude' }
permissions:
  contents: read
jobs:
  cena:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Conferir entrada
        env: { ID: "${{ inputs.id }}" }
        run: printf '%s' "$ID" | grep -Eq '^[a-z0-9-]{2,30}$' || { echo "id inválido"; exit 1; }
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Preparar
        run: |
          for t in 1 2 3; do timeout 300 pip install -q --timeout 60 anthropic playwright pillow edge-tts && break; echo "pip travou, tentativa $t"; done
          timeout 600 python -m playwright install --with-deps chromium > /dev/null
          for t in 1 2 3; do timeout 300 sh -c 'sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null' && break; done
      - name: Cena (API)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ESCRITOR: ${{ inputs.escritor }}
          ID: ${{ inputs.id }}
        run: python3 universo/fabrica/gerar_cena.py "$ID" "$RUNNER_TEMP/u"
      - name: Voz e sons
        env: { ID: "${{ inputs.id }}", SEM_R2: '1' }
        run: python3 universo/fabrica/montar_video.py "$ID" "$RUNNER_TEMP/u"
      - uses: actions/upload-artifact@v4
        with: { name: projeto, path: "${{ runner.temp }}/u/", retention-days: 3 }
  pedaco:
    needs: cena
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix: { i: [0, 1, 2, 3, 4, 5, 6, 7] }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: ./.github/actions/preparar
      - uses: actions/download-artifact@v4
        with: { name: projeto, path: proj }
      - name: Gravar pedaço
        env: { I: '${{ matrix.i }}' }
        run: node gravar.mjs --molde proj/molde --arquivo video.html --pedaco "$I/8" --sem-audio --saida "p$(printf %03d "$I").mp4"
      - uses: actions/upload-artifact@v4
        with: { name: "p${{ matrix.i }}", path: "p*.mp4", retention-days: 1 }
  juntar:
    needs: pedaco
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: ./.github/actions/preparar
        with: { emoji: 'false' }
      - uses: actions/download-artifact@v4
        with: { name: projeto, path: proj }
      - uses: actions/download-artifact@v4
        with: { pattern: 'p*', path: pedacos, merge-multiple: true }
      - name: Juntar, conferir quadros e mixar o som
        env: { ID: "${{ inputs.id }}" }
        run: |
          mkdir -p final
          e=$(jq -r '.duracao * 30 | round' proj/molde/sons.json)
          ls pedacos/*.mp4 | sort | sed "s#^#file '$PWD/#; s#\$#'#" > lista.txt
          ffmpeg -nostdin -y -v error -f concat -safe 0 -i lista.txt -c copy junto.mp4
          q=$(ffprobe -v error -count_packets -select_streams v:0 -show_entries stream=nb_read_packets -of csv=p=0 junto.mp4)
          echo "$q quadros (esperado $e)"; [ "$q" = "$e" ] || { echo "contagem de quadros não bate"; exit 1; }
          node mixar.mjs --molde proj/molde --audio proj/audio --video junto.mp4 --saida "final/universo-$ID.mp4"
          cp proj/saida/ficha.json final/ && cp proj/conferencia.jpg final/ 2>/dev/null || true
          ls -la final
      - uses: actions/upload-artifact@v4
        with: { name: video, path: final/, retention-days: 14 }
