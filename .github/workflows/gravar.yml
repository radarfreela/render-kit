name: gravar
on:
  workflow_dispatch:
    inputs:
      projeto: { description: 'prefixo do projeto no R2', required: true }
      molde: { description: 'subpasta do molde dentro do projeto', default: 'molde' }
      audio: { description: 'subpasta dos áudios dentro do projeto', default: 'audio' }
      arquivo: { description: 'html do molde', default: 'video.html' }
      nome: { description: 'nome do mp4', default: 'video' }
permissions:
  contents: read
jobs:
  gravar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJETO: ${{ inputs.projeto }}
      MOLDE: ${{ inputs.molde }}
      AUDIO: ${{ inputs.audio }}
      ARQUIVO: ${{ inputs.arquivo }}
      NOME: ${{ inputs.nome }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Conferir entradas
        run: |
          ok() { printf '%s' "$1" | grep -Eq '^[A-Za-z0-9._/-]+$' && ! printf '%s' "$1" | grep -q '\.\.'; }
          for v in "$PROJETO" "$MOLDE" "$AUDIO" "$ARQUIVO" "$NOME"; do ok "$v" || { echo "entrada inválida"; exit 1; }; done
          printf '%s' "$NOME" | grep -Eq '^[A-Za-z0-9._-]+$' || { echo "nome inválido"; exit 1; }
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: ffmpeg e fontes
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji > /dev/null
      - run: npm install --no-audit --no-fund --loglevel=error
      - name: Baixar insumos do R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          r2() { aws s3 "$@" --endpoint-url "$R2_ENDPOINT" --only-show-errors > /dev/null 2>&1 < /dev/null; }   # sem eco: log de repo público
          R="s3://$R2_BUCKET/$PROJETO"
          r2 cp --recursive "$R/$MOLDE/" molde/ || { echo "falha no R2"; exit 1; }
          [ -f "molde/$ARQUIVO" ] && [ -f molde/sons.json ] || { echo "molde incompleto no R2"; exit 1; }
          # só os áudios que o sons.json usa
          jq -r '[(.trilha | select(. != null and .volume > 0) | .arquivo), (.narracao // [] | .[].arquivo),
                  (.fundo // [] | .[].arquivo), (.eventos // [] | .[].som)] | unique | .[]' molde/sons.json > _audios.txt
          n=0
          while IFS= read -r f; do
            printf '%s' "$f" | grep -Eq '^[A-Za-z0-9._/-]+$' && ! printf '%s' "$f" | grep -q '\.\.' || { echo "caminho de áudio inválido no sons.json"; exit 1; }
            r2 cp "$R/$AUDIO/$f" "audio/$f" || { echo "falha no R2"; exit 1; }
            n=$((n+1))
          done < _audios.txt
          rm -f _audios.txt
          echo "insumos: molde + $n áudios"
      - name: Gravar
        run: node gravar.mjs --molde molde --arquivo "$ARQUIVO" --saida "saida/$NOME.mp4"
      - name: Som (trilha + efeitos)
        run: node mixar.mjs --molde molde --audio audio --video "saida/$NOME.mp4" --saida "saida/$NOME-som.mp4"
      - name: Versão leve (~20 MB)
        run: ffmpeg -y -loglevel error -i "saida/$NOME-som.mp4" -c:v libx264 -preset slow -crf 22 -maxrate 4M -bufsize 8M -pix_fmt yuv420p -c:a copy -movflags +faststart "saida/$NOME-leve.mp4"
      - name: Subir saída para o R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          r2() { aws s3 "$@" --endpoint-url "$R2_ENDPOINT" --only-show-errors > /dev/null 2>&1 < /dev/null; }   # sem eco: log de repo público
          for f in "$NOME-som.mp4" "$NOME-leve.mp4"; do
            r2 cp "saida/$f" "s3://$R2_BUCKET/saida/$GITHUB_RUN_ID/$f" || { echo "falha no R2"; exit 1; }
          done
          echo "saída: saida/$GITHUB_RUN_ID/"
