name: gravar-paralelo
run-name: gravar-paralelo ${{ inputs.nome }}
# Mesmo resultado do gravar.yml, em N pedaços simultâneos: cada job grava um intervalo de quadros
# (render(t) é determinístico, então os pedaços casam sem pulo); o job final junta sem recomprimir,
# mixa o som e gera a versão leve e a 4:5 no mesmo job.
on:
  workflow_dispatch:
    inputs:
      projeto: { description: 'prefixo do projeto no R2', required: true }
      molde: { description: 'subpasta do molde dentro do projeto', default: 'molde' }
      audio: { description: 'subpasta dos áudios dentro do projeto', default: 'audio' }
      arquivo: { description: 'html do molde', default: 'video.html' }
      nome: { description: 'nome do mp4', default: 'video' }
      pedacos: { description: 'índices dos pedaços (JSON); o total é o tamanho da lista', default: '[0,1,2,3,4,5,6,7]' }
      k4: { description: 'gravar em 4K (sim/nao)', default: 'nao' }
permissions:
  contents: read
env:
  PROJETO: ${{ inputs.projeto }}
  MOLDE: ${{ inputs.molde }}
  AUDIO: ${{ inputs.audio }}
  ARQUIVO: ${{ inputs.arquivo }}
  NOME: ${{ inputs.nome }}
  K4: ${{ inputs.k4 }}
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
jobs:
  pedaco:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        i: ${{ fromJSON(inputs.pedacos) }}
    steps:
      - name: Conferir entradas
        env: { I: '${{ matrix.i }}', N: '${{ strategy.job-total }}' }
        run: |
          ok() { printf '%s' "$1" | grep -Eq '^[A-Za-z0-9._/-]+$' && ! printf '%s' "$1" | grep -q '\.\.'; }
          for v in "$PROJETO" "$MOLDE" "$AUDIO" "$ARQUIVO" "$NOME"; do ok "$v" || { echo "entrada inválida"; exit 1; }; done
          printf '%s' "$NOME" | grep -Eq '^[A-Za-z0-9._-]+$' || { echo "nome inválido"; exit 1; }
          printf '%s/%s' "$I" "$N" | grep -Eq '^[0-9]+/[0-9]+$' || { echo "pedaço inválido"; exit 1; }
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: ./.github/actions/preparar
      - name: Baixar molde do R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          r2() { aws s3 "$@" --endpoint-url "$R2_ENDPOINT" --only-show-errors > /dev/null 2>&1 < /dev/null; }   # sem eco: log de repo público
          mkdir -p molde
          # molde empacotado (1 GET via curl) quando existir; senão, pasta inteira pelo aws
          if R2_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" R2_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" ./r2.sh get "$PROJETO/$MOLDE.tgz" m.tgz > /dev/null 2>&1; then
            tar -xzf m.tgz -C molde
          else
            r2 cp --recursive "s3://$R2_BUCKET/$PROJETO/$MOLDE/" molde/ || { echo "falha no R2"; exit 1; }
          fi
          [ -f "molde/$ARQUIVO" ] || { echo "molde incompleto no R2"; exit 1; }
      - name: Gravar pedaço
        env: { I: '${{ matrix.i }}', N: '${{ strategy.job-total }}' }
        run: node gravar.mjs --molde molde --arquivo "$ARQUIVO" --pedaco "$I/$N" --sem-audio $( [ "$K4" = sim ] && echo --4k ) --saida p.mp4 --saida-leve pl.mp4 --saida-45 pq.mp4
      - name: Subir pedaço para o R2
        env:
          I: ${{ matrix.i }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          r2() { aws s3 "$@" --endpoint-url "$R2_ENDPOINT" --only-show-errors > /dev/null 2>&1 < /dev/null; }   # sem eco: log de repo público
          n=$(printf %03d "$I"); D="s3://$R2_BUCKET/saida/$GITHUB_RUN_ID"
          r2 cp p.mp4 "$D/pedacos/p$n.mp4" & r2 cp pl.mp4 "$D/pedacos-leve/p$n.mp4" & r2 cp pq.mp4 "$D/pedacos-4x5/p$n.mp4" &
          wait %1 && wait %2 && wait %3 || { echo "falha no R2"; exit 1; }
  juntar:
    needs: pedaco
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: ./.github/actions/preparar
        with: { node: 'false', emoji: 'false' }
      - name: Baixar pedaços, sons e áudios do R2
        env:
          PEDACOS: ${{ join(fromJSON(inputs.pedacos), ' ') }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # curl (r2.sh) em paralelo: sem eco de conteúdo, só contagens
          ./r2.sh get "$PROJETO/$MOLDE/sons.json" molde/sons.json > /dev/null 2>&1 || { echo "falha no R2"; exit 1; }
          jq -r '[(.trilha | select(. != null and .volume > 0) | .arquivo), (.narracao // [] | .[].arquivo),
                  (.fundo // [] | .[].arquivo), (.eventos // [] | .[].som)] | unique | .[]' molde/sons.json > _audios.txt
          while IFS= read -r f; do
            printf '%s' "$f" | grep -Eq '^[A-Za-z0-9._/-]+$' && ! printf '%s' "$f" | grep -q '\.\.' || { echo "caminho de áudio inválido no sons.json"; exit 1; }
            echo "$PROJETO/$AUDIO/$f audio/$f"
          done < _audios.txt > _baixar.txt
          for i in $PEDACOS; do n=$(printf %03d "$i"); for v in pedacos pedacos-leve pedacos-4x5; do echo "saida/$GITHUB_RUN_ID/$v/p$n.mp4 $v/p$n.mp4"; done; done >> _baixar.txt
          xargs -P 12 -L 1 sh -c './r2.sh get "$0" "$1" > /dev/null 2>&1 || echo FALHOU' < _baixar.txt > _res.txt
          ! grep -q FALHOU _res.txt || { echo "falha no R2"; exit 1; }
          echo "$(ls pedacos | wc -l) pedaços x 3 versões + $(wc -l < _audios.txt) áudios"
      - name: Juntar (sem recomprimir), conferir quadros e mixar o som
        run: |
          mkdir -p saida
          e=$(jq -r '.duracao * 30 | round' molde/sons.json)
          for v in pedacos pedacos-leve pedacos-4x5; do
            ls $v/*.mp4 | sort | sed "s#^#file '$PWD/#; s#\$#'#" > "l-$v.txt"
            ffmpeg -nostdin -y -v error -f concat -safe 0 -i "l-$v.txt" -c copy "j-$v.mp4"
            q=$(ffprobe -v error -count_packets -select_streams v:0 -show_entries stream=nb_read_packets -of csv=p=0 "j-$v.mp4")
            echo "$v: $q quadros (esperado $e)"; [ "$q" = "$e" ] || { echo "contagem de quadros não bate"; exit 1; }
          done
          node mixar.mjs --molde molde --audio audio --video j-pedacos.mp4 --saida "saida/$NOME-som.mp4" &
          node mixar.mjs --molde molde --audio audio --video j-pedacos-leve.mp4 --saida "saida/$NOME-leve.mp4" &
          node mixar.mjs --molde molde --audio audio --video j-pedacos-4x5.mp4 --saida "saida/$NOME-4x5.mp4" &
          wait %1 && wait %2 && wait %3
      - name: Subir saída para o R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          for f in "$NOME-som.mp4" "$NOME-leve.mp4" "$NOME-4x5.mp4"; do ./r2.sh put "saida/$f" "saida/$GITHUB_RUN_ID/$f" > /dev/null 2>&1 & done
          for j in 1 2 3; do wait %$j || { echo "falha no R2"; exit 1; }; done
          echo "saída: saida/$GITHUB_RUN_ID/"
